<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08080d" />
  <meta name="description" content="Каталог Vstore — цифровые товары, игры, подписки, подарочные карты и пополнение." />
  <title>Каталог — Vstore</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20260811-2" />
  <link rel="stylesheet" href="css/catalog.css?v=20260811-1" />
</head>

<body>
  <div class="bg-glow" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>
    <div class="bg-glow__orb bg-glow__orb--1"></div>
    <div class="bg-glow__orb bg-glow__orb--2"></div>
    <div class="bg-glow__orb bg-glow__orb--3"></div>
    <div class="bg-particles">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="bg-flow-lines">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="bg-geometry">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <header class="header">
    <a href="index.html" class="header__logo" aria-label="Vstore — на главную">
      <img src="assets/brand/logo.svg" alt="Vstore" width="160" height="48" />
    </a>
    <nav class="header__nav">
      <a href="catalog.html" class="header__link" aria-current="page">Каталог</a>
      <a href="faq.html" class="header__link">FAQ</a>
      <a href="https://t.me/MenagerVstore" class="header__link header__link--cta" data-telegram>Telegram</a>
    </nav>
  </header>

  <main class="catalog-page">
    <section class="catalog-shell section scene">
      <div class="container catalog-shell__inner">
        <section class="catalog-hero catalog-hero--image" aria-label="Каталог Vstore">
          <img src="assets/catalog/catalog-hero.png" alt="Каталог Vstore. Цифровые товары: игры, подписки и подарочные карты." />
          <div class="catalog-hero__sparkles" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </section>

        <section class="catalog-tools" aria-label="Поиск и фильтры каталога">
          <label class="catalog-search">
            <span aria-hidden="true">⌕</span>
            <span class="sr-only">Поиск по каталогу</span>
            <input id="catalog-search" type="search" placeholder="Найти Fortnite..." autocomplete="off" />
          </label>

          <div class="catalog-filters" role="group" aria-label="Категории товаров">
            <button class="catalog-filter is-active" type="button" data-catalog-filter="all" aria-pressed="true">Все</button>
            <button class="catalog-filter" type="button" data-catalog-filter="games" aria-pressed="false">Игры</button>
            <button class="catalog-filter" type="button" data-catalog-filter="subs" aria-pressed="false">Подписки</button>
            <button class="catalog-filter" type="button" data-catalog-filter="cards" aria-pressed="false">Карты</button>
            <button class="catalog-filter" type="button" data-catalog-filter="topup" aria-pressed="false">Пополнение</button>
          </div>
        </section>

        <section class="catalog-results" aria-label="Категории каталога">
          <p class="sr-only" data-catalog-status aria-live="polite"></p>
          <div class="catalog-results__grid" data-catalog-grid></div>

          <div class="catalog-empty is-hidden" data-catalog-empty>
            <h2>Ничего не найдено</h2>
            <p>Попробуйте изменить запрос или категорию.</p>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="js/config.js?v=20260804-1"></script>
  <script src="js/products-data.js?v=20260810-1"></script>
  <script src="js/cart.js?v=20260811-2"></script>
  <script src="js/favorites.js?v=20260811-1"></script>
  <script src="js/main.js?v=20260804-3"></script>
  <script src="js/catalog.js?v=20260811-1"></script>
</body>

</html>
